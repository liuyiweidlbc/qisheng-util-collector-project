[program:data_flaskapi]
command=/socbet/python-server/socbeta-data-w500-crawler/.venv/bin/python -u /socbet/python-server/socbeta-data-w500-crawler/source/main.py
directory=/socbet/python-server/socbeta-data-w500-crawler
autostart=true
autorestart=true
startretries=3
stopasgroup=true
killasgroup=true
startsecs=10
stopsignal=TERM
user=root
environment=PATH="/socbet/python-server/socbeta-data-w500-crawler/.venv/bin:%(ENV_PATH)s"
stdout_logfile=/socbet/python-server/socbeta-data-w500-crawler/api_server.log
stderr_logfile=/socbet/python-server/socbeta-data-w500-crawler/api_server.error.log
stdout_logfile_maxbytes=200MB
stdout_logfile_backups=7

[group:500.py.srv]
programs=data_flaskapi # 包含的进程名称列表（逗号分隔）
priority=1000  # 启动优先级（数值越小越优先）
