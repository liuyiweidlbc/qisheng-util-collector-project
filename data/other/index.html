body {
  margin: 0;
}

      @keyframes lds-ring {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      
      #lds-ring-container {
        display: flex;
        justify-content: center;
        align-items: center;
        position: fixed;
        inset: 0;
        z-index: 101;
        background-color: #ffffff;
        overscroll-behavior: none;
        touch-action: none;
      }
      .lds-container {
        position: relative;
        width: 85px;
        height: 85px;
        transform: rotate(-22.5deg);
        animation: lds-ring 1.66s linear infinite;
      }
      
      .loader-ring {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .loader-ring > div {
        background-color: #ffffff;
        width: calc(100% - 6px);
        height: calc(100% - 6px);
        border-radius: 50%;
        position: absolute;
        left: 3px;
        top: 3px;
      }
      .loader-dot {
        position: absolute;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #000000;
        top: calc(50% - 2.5px);
        right: -1px
      }
      #loading-logo-container {
        position: absolute;
        width: 48px;
        height: 48px;
        transform: translate(-50%, -50%);
        top: 50%;
        left: 50%;
        background-color: #ffffff;
      }
      
      #loading-logo-container svg {
        background-color: transparent;
        display: block;
        fill: var(--loading-logo-color, currentColor);
      }
    </style>
